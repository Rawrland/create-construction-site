<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bp" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2f74c0"/>
      <stop offset="1" stop-color="#174a8a"/>
    </radialGradient>
    <pattern id="minor" width="12" height="12" patternUnits="userSpaceOnUse" x="20" y="20">
      <path d="M12 0H0V12" fill="none" stroke="#ffffff" stroke-opacity=".11" stroke-width="1.5"/>
    </pattern>
    <pattern id="major" width="60" height="60" patternUnits="userSpaceOnUse" x="20" y="20">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="2"/>
    </pattern>
    <clipPath id="inner"><circle cx="200" cy="200" r="180"/></clipPath>
  </defs>

  <!-- white badge -->
  <circle cx="200" cy="200" r="196" fill="#ffffff"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#c9d3de" stroke-width="2"/>

  <!-- blueprint -->
  <circle cx="200" cy="200" r="184" fill="#0f3a70"/>
  <circle cx="200" cy="200" r="180" fill="url(#bp)"/>
  <g clip-path="url(#inner)">
    <rect width="400" height="400" fill="url(#minor)"/>
    <rect width="400" height="400" fill="url(#major)"/>
  </g>

  <g fill="none" stroke="#1a1d22" stroke-linejoin="round" stroke-linecap="round">
    <!-- mounting ear and pin -->
    <path d="M184 150 L186 112 Q188 102 200 102 L218 102 Q230 102 230 114 L228 150" stroke-width="5" fill="#c8913a"/>
    <circle cx="208" cy="120" r="9" stroke-width="4"/>

    <!-- bucket side plate: top plate, curved back and floor, cutting edge, open front -->
    <path d="M146 150 L270 150 Q318 150 318 204 Q318 286 228 296 L118 296 Z"
          stroke-width="6" fill="#c8913a"/>
    <!-- the open front: back wall of the bucket seen inside -->
    <path d="M152 166 L262 166 Q300 166 300 206 Q300 270 228 280 L136 280"
          stroke-width="3" stroke-opacity=".7"/>
    <!-- side cutter -->
    <path d="M146 150 L118 296" stroke-width="6"/>
    <!-- tooth -->
    <path d="M120 296 L80 300 L118 280" stroke-width="5" fill="#c8913a"/>
  </g>
  <!-- centre marks on pins -->
  <g stroke="#1a1d22" stroke-width="1.5" stroke-opacity=".7">
    <path d="M196 120 H220 M208 108 V132"/>
  </g>
</svg>
